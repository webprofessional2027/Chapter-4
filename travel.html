<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Booking | Travel With Us</title>
</head>
<body>

    <h1>Plan Your Dream Vacation</h1>
    <p>Fill out the form below to start planning your next adventure!</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Travel Details</legend>

            <label for="destination">Choose Your Destination:</label>
            <select id="destination" name="destination" required>
                <option value="" disabled>Select a destination</option>
                <option value="paris">Paris, France</option>
                <option value="bali">Bali, Indonesia</option>
                <option value="switzerland">Switzerland</option>
                <option value="goa">Goa, India</option>
                <option value="manali">Manali, India</option>
                <option value="dubai">Dubai, UAE</option>
            </select>

            <br><br>

            <label for="departure">Departure Date:</label>
            <input type="date" id="departure" name="departure" required>

            <br><br>

            <label for="return">Return Date:</label>
            <input type="date" id="return" name="return" required>

            <br><br>

            <label for="travelers">Number of Travelers:</label>
            <input type="number" id="travelers" name="travelers"
                   min="1" max="20" value="1" required>

            <br><br>

            <label for="budget">Budget Per Person:</label>
            <select id="budget" name="budget" required>
                <option value="" disabled>Select your budget</option>
                <option value="under-10000">Under INR 10,000</option>
                <option value="10000-25000"> INR 10,000 – INR 25,000</option>
                <option value="25000-50000">INR 25,000 – INR 50,000</option>
                <option value="above-50000">Above INR 50,000</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend>Accommodation Preferences</legend>

            <p>Choose your accommodation:</p>

            <input type="radio" id="hotel" name="accommodation"
                   value="hotel" required>
            <label for="hotel">Hotel</label>

            <input type="radio" id="resort" name="accommodation"
                   value="resort">
            <label for="resort">Resort</label>

            <input type="radio" id="hostel" name="accommodation"
                   value="hostel">
            <label for="hostel">Hostel</label>

            <br><br>

            <label for="requests">Special Requests:</label>
            <br>
            <textarea id="requests" name="requests" rows="4" cols="40"
                      placeholder="Tell us about your preferences..."></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Contact Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name"
                   autocomplete="name" required>

            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com"
                   autocomplete="email" required>

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number"
                   autocomplete="tel" required>

        </fieldset>

        <br>

        <button type="submit">Book My Vacation</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
